<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Forge3D — éditeur (téléphone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#F5A04A}a:hover{color:#FFC27D}
.bed{background-color:#0E0F12;background-image:linear-gradient(#22252B 1px,transparent 1px),linear-gradient(90deg,#22252B 1px,transparent 1px);background-size:28px 28px}
input[type=range]{width:100%}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #121316; color: #EDEEF0; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 6px; background: #17181C; border-bottom: 1px solid #2B2E34">
<a href="MobileModeles.dc.html" aria-label="Retour aux modèles" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEEF0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px">Trophée Normandie</span>
<span style="font-size: 12px; color: #A3A9B2">2 pièces · 250 mm</span>
</span>
<div style="flex: 1 1 10px"></div>
<span style="display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: #1C2A22; color: #8FE0B0; font-size: 12px; font-weight: 500">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Prêt</span>
</header>

<div class="bed" style="position: relative; height: 330px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center">
<img src="/_blob/28c64ffdccb35dd8536bee86f29336c6" alt="Aperçu 3D du trophée Normandie" style="height: 300px; width: auto; object-fit: contain">
<div role="group" aria-label="Vues" style="position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #17181CE6; border: 1px solid #2B2E34">
<button type="button" style="min-width: 44px; height: 36px; border: none; border-radius: 7px; background: #2A2D33; color: #EDEEF0; font: inherit; font-size: 13px">3/4</button>
<button type="button" style="min-width: 44px; height: 36px; border: none; border-radius: 7px; background: transparent; color: #A3A9B2; font: inherit; font-size: 13px">Face</button>
</div>
</div>

<section aria-label="Réglages" style="flex: 1 1 auto; display: flex; flex-direction: column; margin-top: -14px; border-radius: 18px 18px 0 0; background: #17181C; border-top: 1px solid #2B2E34; padding: 8px 18px 0">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A3E46"></span>
<div role="tablist" aria-label="Panneaux" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-top: 10px; padding: 4px; border-radius: 10px; background: #121316">
<button type="button" role="tab" aria-selected="false" style="min-height: 40px; border: none; border-radius: 7px; background: transparent; color: #A3A9B2; font: inherit; font-size: 13px">Éléments</button>
<button type="button" role="tab" aria-selected="true" style="min-height: 40px; border: none; border-radius: 7px; background: #2A2D33; color: #EDEEF0; font: inherit; font-size: 13px; font-weight: 600">Propriétés</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 40px; border: none; border-radius: 7px; background: transparent; color: #A3A9B2; font: inherit; font-size: 13px">Impression</button>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 0">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600">Banderole du bouclier</span>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="color: #A3A9B2; font-size: 13px">Texte</span>
<input type="text" value="DÉFIS SPORTIFS" style="min-height: 46px; padding: 0 12px; border: 1px solid #3A3E46; border-radius: 10px; background: #121316; color: #EDEEF0; font: inherit; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; color: #A3A9B2; font-size: 13px"><span>Hauteur des lettres</span><span style="color: #EDEEF0; font-weight: 500">7,0 mm</span></span>
<input type="range" min="3" max="12" step="0.1" value="7" style="accent-color: {{accent}}">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; color: #A3A9B2; font-size: 13px"><span>Courbure du ruban</span><span style="color: #EDEEF0; font-weight: 500">12 mm</span></span>
<input type="range" min="0" max="30" step="1" value="12" style="accent-color: {{accent}}">
</label>
</div>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 12px 18px 22px; background: #17181C; border-top: 1px solid #2B2E34">
<button type="button" aria-label="Annuler la dernière modification" style="width: 52px; height: 52px; flex: 0 0 auto; border: 1px solid #3A3E46; border-radius: 12px; background: transparent; color: #EDEEF0; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
<button type="button" style="flex: 1 1 auto; min-height: 52px; border: none; border-radius: 12px; background: {{accent}}; color: #1A1206; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>Exporter les STL</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F59E3D","options":["#F59E3D","#E8C547","#5EA8F5","#5BC88A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F59E3D' };
  }
}
</script>
</body>
</html>
