<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Forge3D — atelier (téléphone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#F5A04A}a:hover{color:#FFC27D}
.bed{background-color:#0E0F12;background-image:linear-gradient(#22252B 1px,transparent 1px),linear-gradient(90deg,#22252B 1px,transparent 1px);background-size:24px 24px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #121316; color: #EDEEF0; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #17181C; border-bottom: 1px solid #2B2E34">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px">Atelier</span>
<div role="group" aria-label="Mode de l'atelier" style="display: flex; gap: 2px; padding: 3px; margin-left: 6px; border-radius: 9px; background: #121316; border: 1px solid #2B2E34">
<a href="#" style="display: flex; align-items: center; min-height: 34px; padding: 0 10px; border-radius: 6px; background: #2A2D33; color: #EDEEF0; text-decoration: none; font-size: 13px; font-weight: 600">Formes</a>
<a href="#" style="display: flex; align-items: center; min-height: 34px; padding: 0 10px; border-radius: 6px; color: #A3A9B2; text-decoration: none; font-size: 13px">Croquis</a>
</div>
<div style="flex: 1 1 10px"></div>
<button type="button" aria-label="Annuler" style="width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #EDEEF0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
<button type="button" aria-label="Exporter le STL" style="width: 44px; height: 44px; border: none; border-radius: 10px; background: {{accent}}; color: #1A1206; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></button>
</header>

<div class="bed" style="position: relative; height: 340px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center">
<img src="/_blob/7df2ea19a063fdb06eb08998fb9f0136" alt="Support de téléphone assemblé avec des formes, le dossier sélectionné" style="width: 330px; height: auto; object-fit: contain">
<span style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 5px 10px; border-radius: 6px; background: {{accent}}; color: #1A1206; font-size: 12px; font-weight: 600">Dossier sélectionné</span>
<span style="position: absolute; left: 12px; bottom: 10px; padding: 5px 9px; border-radius: 6px; background: #17181CE6; color: #A3A9B2; font-size: 12px">Pincer pour zoomer · 2 doigts pour tourner</span>
</div>

<div style="display: flex; gap: 8px; padding: 12px 14px; overflow: hidden; border-bottom: 1px solid #2B2E34">
<button type="button" style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 62px; padding: 8px 0; border: 1px solid #2B2E34; border-radius: 10px; background: #1F2125; color: #EDEEF0; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>Cube</button>
<button type="button" style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 62px; padding: 8px 0; border: 1px solid #2B2E34; border-radius: 10px; background: #1F2125; color: #EDEEF0; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="2.6"></ellipse><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"></path></svg>Cylindre</button>
<button type="button" style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 62px; padding: 8px 0; border: 1px solid #2B2E34; border-radius: 10px; background: #1F2125; color: #EDEEF0; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><ellipse cx="12" cy="12" rx="8" ry="3"></ellipse></svg>Sphère</button>
<button type="button" style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 62px; padding: 8px 0; border: 1px solid #2B2E34; border-radius: 10px; background: #1F2125; color: #EDEEF0; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L5 18"></path><path d="M12 3l7 15"></path><ellipse cx="12" cy="18" rx="7" ry="2.6"></ellipse></svg>Cône</button>
<button type="button" style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 62px; padding: 8px 0; border: 1px solid #2B2E34; border-radius: 10px; background: #1F2125; color: #EDEEF0; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 6V4h14v2"></path><path d="M12 4v16"></path><path d="M9 20h6"></path></svg>Texte</button>
</div>

<section aria-label="Propriétés du dossier" style="display: flex; flex-direction: column; gap: 12px; padding: 14px">
<div role="group" aria-label="Type de forme" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 10px; background: #17181C; border: 1px solid #2B2E34">
<button type="button" aria-pressed="true" style="min-height: 40px; border: none; border-radius: 7px; background: #2A2D33; color: #EDEEF0; font: inherit; font-weight: 600">Solide</button>
<button type="button" aria-pressed="false" style="min-height: 40px; border: none; border-radius: 7px; background: transparent; color: #A3A9B2; font: inherit">Trou</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #A3A9B2">Largeur<input type="number" value="80" style="min-height: 44px; padding: 0 8px; border: 1px solid #3A3E46; border-radius: 8px; background: #17181C; color: #EDEEF0; font: inherit; font-size: 16px"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #A3A9B2">Profondeur<input type="number" value="6" style="min-height: 44px; padding: 0 8px; border: 1px solid #3A3E46; border-radius: 8px; background: #17181C; color: #EDEEF0; font: inherit; font-size: 16px"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #A3A9B2">Hauteur<input type="number" value="78" style="min-height: 44px; padding: 0 8px; border: 1px solid #3A3E46; border-radius: 8px; background: #17181C; color: #EDEEF0; font: inherit; font-size: 16px"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; color: #A3A9B2; font-size: 13px"><span>Inclinaison</span><span style="color: #EDEEF0; font-weight: 500">−22°</span></span>
<input type="range" min="-90" max="90" step="1" value="-22" style="width: 100%; accent-color: {{accent}}">
</label>
</section>

<nav aria-label="Navigation" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 10px 18px; background: #17181C; border-top: 1px solid #2B2E34">
<a href="MobileModeles.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #A3A9B2; text-decoration: none; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8 4.5v9.5l-8 4.5-8-4.5V7z"></path><path d="M12 11.5l8-4.5M12 11.5v9.5M12 11.5L4 7"></path></svg>Modèles</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: {{accent}}; text-decoration: none; font-size: 12px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.6L6 21"></path><path d="M12 7.6l6 13.4"></path><path d="M8 16h8"></path><circle cx="12" cy="5.5" r="2.1"></circle></svg>Atelier</a>
<a href="MobileIA.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #A3A9B2; text-decoration: none; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z"></path><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"></path></svg>IA</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #A3A9B2; text-decoration: none; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Projets</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F59E3D","options":["#F59E3D","#E8C547","#5EA8F5","#5BC88A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F59E3D' };
  }
}
</script>
</body>
</html>
